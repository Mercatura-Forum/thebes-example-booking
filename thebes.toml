[project]
name = "thebes-example-booking-throwaway"
default_network = "wan"
chain_id = 2026

[networks.wan]
# One stable public name resolves the whole validator set behind the
# boundary — never put validator IPs here.
gateway = "https://memphis.mercaturaforum.com"
routing = "smart"

[canisters.booking]
type = "backend-motoko"
cid = 11001522932367
wasm = "build/booking.wasm"
build = 'cd motoko && mops install >/dev/null 2>&1 && mkdir -p ../build && MOC="$(ls "$HOME/.cache/mops/moc/1.4.1/moc" "$HOME/Library/Caches/mops/moc/1.4.1/moc" 2>/dev/null | head -1)" && "$MOC" $(mops sources) -o ../build/booking.wasm main.mo'

[canisters.web]
type = "frontend"
cid = 177129167469535
wasm = "asset_canister.wasm"
bundle = "frontend/dist"
health_check_url = "/index.html"
